<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - DevWork</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
  <a href="index.html" class="back-link">← Voltar ao início</a>

  <div class="auth-container">
    <div class="logo-circle">DW</div>
    <h2>Bem-vindo de volta</h2>
    <p>Entre na sua conta para acessar seus espaços</p>

    <form>
      <label>Email</label>
      <input type="email" placeholder="seu@email.com" required>

      <label>Senha</label>
      <input type="password" placeholder="Sua senha" required>

      <div class="options">
        <label><input type="checkbox"> Lembrar de mim</label>
        <a href="#">Esqueceu a senha?</a>
      </div>

      <button type="submit" class="btn-primary">Entrar</button>
    </form>

    <p class="switch">Não tem uma conta? <a href="signup.html">Cadastre-se</a></p>
  </div>
</body>
</html>
