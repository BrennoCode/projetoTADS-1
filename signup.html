<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - DevWork</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
  <a href="index.html" class="back-link">← Voltar ao início</a>

  <div class="auth-container">
    <div class="logo-circle">DW</div>
    <h2>Crie sua conta</h2>
    <p>Junte-se à comunidade DevWork</p>

    <form>
      <label>Nome completo</label>
      <input type="text" placeholder="Seu nome completo" required>

      <label>Email</label>
      <input type="email" placeholder="seu@email.com" required>

      <label>Senha</label>
      <input type="password" placeholder="Mínimo 6 caracteres" required>

      <label>Confirmar senha</label>
      <input type="password" placeholder="Confirme sua senha" required>

      <label class="checkbox">
        <input type="checkbox" required>
        Aceito os <a href="#">termos de uso</a> e a <a href="#">política de privacidade</a>
      </label>

      <button type="submit" class="btn-primary">Criar conta</button>
    </form>

    <p class="switch">Já tem uma conta? <a href="login.html">Faça login</a></p>
  </div>
</body>
</html>
